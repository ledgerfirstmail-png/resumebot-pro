# CI (ROADMAP D2): typecheck, lint, and unit tests on every push/PR.
# src/convex/_generated is gitignored, so Convex codegen runs first —
# verified to exit 0 without Convex authentication (empty HOME, no
# deployment env vars).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Convex codegen
        run: bunx convex codegen

      - name: Typecheck
        run: bun tsc -b --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
